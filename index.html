<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神威私札｜欧比咔咔之家</title>
  <meta name="description" content="一座藏在神威空间里的带卡私人论坛与故事档案。">
  <meta name="theme-color" content="#8b5f4a">
  <style>
    :root {
      --bg: #e9e4dc;
      --paper: #fbf8f1;
      --ink: #34302d;
      --muted: #746c63;
      --line: #d7cbbd;
      --accent: #8b5f4a;
      --accent-deep: #5c4437;
      --sage: #75806e;
      --rose: #ad7468;
      --shadow: 0 20px 55px rgba(63, 52, 43, .22);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.72), transparent 32rem),
        linear-gradient(135deg, #d9d1c5 0%, var(--bg) 42%, #cfc6ba 100%);
    }
    body.locked, body.modal-open { overflow: hidden; }
    button, input { font: inherit; }

    .password-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        linear-gradient(rgba(40,34,30,.56), rgba(40,34,30,.68)),
        repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px),
        var(--bg);
      transition: opacity .45s ease, visibility .45s ease;
    }
    .password-screen::before {
      content: "Created By J";
      position: absolute;
      right: 5vw;
      bottom: 5vh;
      color: rgba(251,248,241,.12);
      font-size: clamp(48px, 9vw, 132px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .02em;
      white-space: nowrap;
      transform: rotate(-4deg);
      transform-origin: right bottom;
    }
    .password-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .password-card {
      position: relative;
      overflow: hidden;
      width: min(430px, 100%);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.38);
      background: rgba(251,248,241,.94);
      box-shadow: 18px 18px 0 var(--accent-deep);
    }
    .password-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      background: var(--accent);
    }
    .lock-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fffaf2;
      color: var(--accent-deep);
      font-size: 22px;
    }
    .password-card h1 {
      margin: 0 0 8px;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    .password-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .password-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0;
      border: 1px solid var(--accent-deep);
    }
    .password-row input {
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 0;
      background: #fffdf8;
      color: var(--ink);
      outline: none;
    }
    .password-row input:focus { box-shadow: inset 0 0 0 3px rgba(139,95,74,.16); }
    .password-row button, .back-button {
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: var(--accent-deep);
      color: #fffaf2;
      cursor: pointer;
    }
    .password-row button { border-radius: 0; }
    .password-error { min-height: 20px; margin-top: 10px; color: #9b3f37; font-size: 13px; }

    .forum-shell { width: min(1240px, calc(100% - 48px)); margin: 48px auto 96px; }
    .forum-board {
      border: 1px solid rgba(98,78,63,.22);
      background: rgba(251,248,241,.94);
      box-shadow: var(--shadow);
    }
    .forum-header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: end;
      gap: 22px;
      min-height: 360px;
      padding: 64px 56px 48px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(139,95,74,.18), rgba(117,128,110,.15), rgba(173,116,104,.13)),
        rgba(255,250,242,.84);
    }
    .forum-header::before {
      content: "Created by J某人";
      position: absolute;
      right: 4%;
      top: 50%;
      color: rgba(92,68,55,.12);
      font-size: clamp(72px, 12vw, 178px);
      font-weight: 800;
      line-height: .85;
      letter-spacing: -.06em;
      white-space: nowrap;
      transform: translateY(-50%) rotate(-4deg);
      pointer-events: none;
      user-select: none;
    }
    .forum-header > * { position: relative; z-index: 1; }
    .forum-kicker {
      max-width: 480px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: .08em;
    }
    .forum-title-line { display: flex; align-items: flex-end; gap: 18px; max-width: 760px; }
    .forum-header h2 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(46px, 7vw, 92px);
      line-height: .9;
      letter-spacing: -.07em;
    }
    .forum-copyright { max-width: 620px; margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

    .forum-stats { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
    .stat-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: auto;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid rgba(92,68,55,.28);
      border-radius: 2px;
      background: rgba(255,255,255,.48);
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .stat-box:hover, .stat-box:focus-visible { background: rgba(255,255,255,.78); border-color: var(--accent); outline: none; }
    .stat-box:active { transform: translateY(1px); }
    .stat-label, .stat-value { display: inline; margin: 0; font-size: 13px; line-height: 20px; }
    .stat-label { color: var(--muted); }
    .stat-value { color: var(--accent-deep); font-weight: 700; }

    .topic-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(139,95,74,.94);
      color: #fffaf2;
      font-size: 13px;
      letter-spacing: .08em;
    }
    .topic-list { display: grid; }
    .topic-row {
      position: relative;
      display: grid;
      grid-template-columns: 64px minmax(0,1fr) 112px 112px;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 116px;
      padding: 22px 28px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(251,248,241,.82);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: background .3s cubic-bezier(.22,1,.36,1), padding-left .3s cubic-bezier(.22,1,.36,1);
    }
    .topic-row:nth-child(even) { background: rgba(243,238,229,.86); }
    .topic-row:hover, .topic-row:focus-visible { padding-left: 36px; background: #fffaf5; outline: none; }
    .topic-row:last-child { border-bottom: 0; }
    .topic-row::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--accent);
      transition: width .3s cubic-bezier(.22,1,.36,1);
    }
    .topic-row:hover::before, .topic-row:focus-visible::before { width: 5px; }
    .topic-avatar {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(135deg, #fff7ed, #d8cdc1);
      color: var(--accent-deep);
      font-weight: 700;
    }
    .topic-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; margin-bottom: 7px; }
    .topic-title strong { overflow-wrap: anywhere; font-size: 20px; line-height: 1.45; }
    .topic-badge, .topic-tone {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid rgba(92,68,55,.18);
      background: rgba(255,255,255,.48);
      color: var(--accent-deep);
      font-size: 12px;
      white-space: nowrap;
    }
    .topic-tone { border-color: var(--sage); background: var(--sage); color: #fffaf2; }
    .topic-meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .topic-count { color: var(--muted); font-size: 12px; text-align: right; }
    .topic-number { display: block; margin-bottom: 2px; color: var(--accent-deep); font-size: 20px; }

    .reader-view { display: none; }
    .reader-view.active { display: block; }
    .home-view.hidden { display: none; }
    .reader-bar {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,250,242,.88);
    }
    .back-button { min-width: 94px; }
    .reader-title { min-width: 0; }
    .reader-title h3 { margin: 0 0 3px; overflow-wrap: anywhere; font-size: 18px; line-height: 1.35; }
    .reader-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .reader-frame-wrap { padding: 14px; background: #d7cfc4; }
    .chapter-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 168px);
      min-height: 720px;
      border: 1px solid rgba(69,56,45,.28);
      background: #fffaf2;
    }
    .reader-view.flat-thread-reader .reader-frame-wrap { padding: 0; background: transparent; }
    .reader-view.flat-thread-reader .chapter-frame { border: 0; }
    .chapter-frame.is-scrollable { height: min(78vh,860px); min-height: 560px; }

    .users-modal { position: fixed; inset: 0; z-index: 1200; display: none; place-items: center; padding: 24px; }
    .users-modal.active { display: grid; }
    .users-backdrop { position: absolute; inset: 0; background: rgba(43,35,29,.38); backdrop-filter: blur(5px); }
    .users-panel {
      position: relative;
      overflow: hidden;
      width: min(760px,100%);
      max-height: min(760px,calc(100vh - 48px));
      border: 1px solid rgba(92,68,55,.2);
      background: #f7f1e7;
      box-shadow: 0 24px 70px rgba(45,35,28,.28);
      color: var(--ink);
    }
    .users-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid rgba(92,68,55,.16);
      background: rgba(255,255,255,.34);
    }
    .users-panel h3 { margin: 0; font-size: 24px; line-height: 1.15; }
    .users-close {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(92,68,55,.18);
      border-radius: 50%;
      background: rgba(255,255,255,.58);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .users-close:hover, .users-close:focus-visible { background: #fffaf2; outline: none; }
    .users-list { display: grid; gap: 10px; max-height: calc(min(760px,100vh - 48px) - 96px); overflow-y: auto; padding: 16px 18px 20px; }
    .user-card {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr);
      align-items: start;
      gap: 14px;
      padding: 14px;
      border: 1px solid rgba(92,68,55,.12);
      background: rgba(255,255,255,.5);
    }
    .user-avatar { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #e2d5c5; color: var(--accent-deep); font-size: 24px; line-height: 1; }
    .user-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; margin-bottom: 5px; color: #2f2a26; font-size: 16px; font-weight: 760; line-height: 1.45; white-space: pre-wrap; }
    .user-nickname { padding: 2px 8px; border: 1px solid rgba(92,68,55,.12); border-radius: 999px; background: rgba(92,68,55,.08); color: #625a52; font-size: 13px; font-weight: 500; }
    .user-note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .user-extra { display: inline-block; margin-top: 5px; padding: 4px 8px; border-left: 3px solid rgba(117,128,110,.46); border-radius: 0 6px 6px 0; background: rgba(117,128,110,.13); color: #4f4943; font-size: 12.5px; line-height: 1.65; }

    @media (max-width: 860px) {
      .forum-shell { width: min(100% - 20px,1240px); margin: 18px auto 48px; }
      .forum-header { grid-template-columns: 1fr; min-height: auto; padding: 88px 24px 32px; }
      .forum-title-line { display: block; }
      .forum-copyright { margin-top: 12px; }
      .forum-stats { justify-content: flex-start; }
      .stat-box { min-height: 38px; padding: 7px 10px; }
      .topic-toolbar { padding: 10px 14px; }
      .topic-row { grid-template-columns: 40px minmax(0,1fr); gap: 10px; min-height: 0; padding: 12px 14px; }
      .topic-row:hover { padding-left: 18px; }
      .topic-avatar { width: 40px; height: 40px; font-size: 13px; }
      .topic-title { gap: 5px; margin-bottom: 4px; }
      .topic-title strong { font-size: 17px; line-height: 1.35; }
      .topic-meta { font-size: 12px; line-height: 1.4; }
      .topic-badge, .topic-tone { min-height: 20px; padding: 1px 6px; font-size: 11px; }
      .topic-count { display: none; }
      .reader-bar { position: sticky; top: 0; z-index: 10; grid-template-columns: 1fr auto; gap: 10px; padding: 12px; }
      .back-button { grid-column: 1 / 3; width: 100%; min-height: 40px; }
      .reader-title h3 { font-size: 16px; }
      #readerBadge { align-self: start; }
      .reader-frame-wrap { padding: 6px 0 0; }
      .chapter-frame { height: 700px; border-right: 0; border-left: 0; }
      .chapter-frame.is-scrollable { height: 72vh; min-height: 480px; }
      .users-modal { align-items: end; padding: 0; }
      .users-panel { width: 100%; max-height: 84vh; border-right: 0; border-bottom: 0; border-left: 0; border-radius: 16px 16px 0 0; }
      .users-panel-head { padding: 18px 16px 13px; }
      .users-panel h3 { font-size: 20px; }
      .users-list { max-height: calc(84vh - 86px); padding: 12px; }
      .user-card { grid-template-columns: 42px minmax(0,1fr); gap: 11px; padding: 12px; }
      .user-avatar { width: 42px; height: 42px; font-size: 21px; }
      .user-name { gap: 6px; font-size: 15px; }
      .user-nickname { padding: 1px 7px; font-size: 12px; }
      .user-note { font-size: 13.5px; line-height: 1.68; }
    }

    @media (max-width: 520px) {
      .password-screen::before { right: 3vw; bottom: 3vh; font-size: 42px; }
      .password-card { box-shadow: 10px 10px 0 var(--accent-deep); }
      .password-row { grid-template-columns: 1fr; }
      .forum-header h2 { font-size: 48px; }
      .topic-row { grid-template-columns: 36px minmax(0,1fr); padding: 10px 12px; }
      .topic-row:hover { padding-left: 16px; }
      .topic-avatar { width: 36px; height: 36px; }
      .topic-title strong { font-size: 16px; }
      .topic-meta { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    <div class="ao3-rank-list">
      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">1</span><span class="ao3-rank-avatar ao3-tone-puppy">🐕‍🦺</span><span class="ao3-rank-info"><strong>仔卡</strong><br /><small>矜持又骄傲的天才少年，有被仔土好好爱护。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><p>那个吊车尾根本就是变态！我都说不要了，结果还是一个劲儿的伸舌头舔那里，像吃果冻一样，甚至还要用牙齿咬。我实在是受不了了，于是我拿脚蹬他，结果他还要抬起头来莫名其妙说一句——「卡卡西你下面好甜哦！」，还要不停地问我「舒服吗？」。下次我一定要拿大腿夹爆这家伙的脑袋！</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-anbu">🐱 </span><strong>木叶热心小学生</strong></p><p>笨蛋卡卡西！你这家伙——明明在被我舔的时候还一直叫着好舒服，怎么转头跑到论坛上讲我坏话，太差劲啦！</p><p class="ao3-actions">👍 18　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-hokage">💯</span><strong>你有看到我老婆吗</strong></p><p>卡卡西的身体原来小时候就这么敏感了吗？ps.阴蒂和乳粒如果好好调教的话，可以变成碰一下就会高潮的开关。</p><p class="ao3-actions">👍 21　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">2</span><span class="ao3-rank-avatar ao3-tone-anbu">🐾</span><span class="ao3-rank-info"><strong>暗部卡</strong><br /><small>看似青涩，其实已经身经百战（和除了暴怒以外的带土都会做哦）。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><span class="ao3-dialog-avatar ao3-tone-anbu">🐾</span><p>(*一张照片，照片上的暗部已经呈昏迷状态，黑色紧身衣被拉上去，露出满是红痕和牙印的一双小奶子，微鼓的小腹上写了一个半正字，正在被橙色旋涡面具怪人抱着双腿向镜头展示被射满淌精的小屄）</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">💌</span><strong>一般路过家庭煮夫</strong></p><p>……不要那样对他。卡卡西已经昏过去了，这张照片不是他自己愿意发出来的吧。</p><p class="ao3-actions">👍 28　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-puppy">🍆</span><strong>红月大计吧</strong></p><p>果然，这个角度拍出来的照片，不管看几次，都觉得实在是煽情得很。</p><p class="ao3-actions">👎 12　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">3</span><span class="ao3-rank-avatar ao3-tone-jonin">🦘</span><span class="ao3-rank-info"><strong>上忍卡</strong><br /><small>已经和上忍带土正式开始交往啦。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><p>唔，那就是上周末的早上？带土突然从背后抱过来——其实那个时候我很快就醒了，不过毕竟这是带土想玩的play，所以我只好闭着眼睛继续装睡。带土用已经完全硬起来的几把顶开了我的穴口，一开始有一些干涩，不过感受着他落在我后颈的喘息和那根凶器的烫度，我的身体很快就会自顾自分泌出大量淫液来方便他动作，不消一会儿我的那里就被他搞得黏糊糊、湿答答的一片。因为很舒服，所以我情不自禁吐了一截舌头出来，眼睛也眯了起来，我看到清晨的光从窗帘缝隙里漏进来，照在带土环在我腰上的手臂上……他抽插了几十个来回后，终于忍不住戳穿我装睡的事实，我没忍住笑出了声，只好努力用肉穴夹他的几把，权当做讨好的吻来回应带土。</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-spirit">💅</span><strong>圈圈面具怪人</strong></p><p>哎呀！阿飞下次要建议那个白痴上忍先用幻术把你放倒啦——其实卡卡西就算是昏迷的状态，那口屄也紧俏得很，小穴里的肉肉还会自己蠕动，夹得阿飞忍不住在里面射了一次又一次，那感觉实在是太爽了！</p><p class="ao3-actions">👍 23　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-puppy">🐱</span><strong>木叶热心小学生</strong></p><p>耶！以后就算当上了上忍也是和卡卡西住在一起，好开心哦！（ps.楼上这个涂指甲油头像的家伙到底是谁啊？人品很差的样子！）</p><p class="ao3-actions">👍 19　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-hokage">💌</span><strong>一般路过家庭煮夫</strong></p><p>唔，卡卡西会喜欢被晨埋，记录一下。</p><p class="ao3-actions">👍 16　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">4</span><span class="ao3-rank-avatar ao3-tone-hokage">🦭</span><span class="ao3-rank-info"><strong>六火</strong><br /><small>虽然工作很累，但在贴心人夫战犯的照顾，还是下长出了小肚子。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><p>嗯……最近迷上了一个新的玩法，如果坐到带土脸上的话，可以用阴蒂去和带土脸上的疤痕摩擦，真的好舒服……不过，有时候我坐在他脸上，摇屁股摇的太过沉迷的话，就会被带土惩罚，他会直接毫不留情地用牙齿咬我的阴蒂。虽然很痛啦，但是也有一点点爽，并且每次这样做了之后，带土也会很温柔地用舌头安抚阴蒂哦。总而言之，这家伙现在真的完全就是性爱大师！我现在的身体已经是一副完全离不开带土的样子了。</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-anbu">💯</span><strong>你有看到我老婆吗</strong></p><p>原来卡卡西也会有成为火影的一天啊……那家伙，当初在自己的护额上划下那一道的时候，到底是什么样的心情呢？</p><p class="ao3-actions">👍 15　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-scan">😿</span><strong>这一切都是错误的</strong></p><p>你这家伙就那么心甘情愿坐在他身上表现得像个饥渴的婊子一样吗？那家伙有哪里好？</p><p class="ao3-actions">👍 24　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">💌</span><strong>一般路过家庭煮夫</strong></p><p>？这个脏兮兮的小孩又是哪里来的</p><p class="ao3-actions">👍 18　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">5</span><span class="ao3-rank-avatar ao3-tone-spirit">👻</span><span class="ao3-rank-info"><strong>付丧神</strong><br /><small>没有形体，寄宿在漂泊武士佩刀里的一抹幽魂。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><p>那天月色正好，漂泊大人坐在松木廊道的檐廊边缘，他正一杯接着一杯地喝着漆器托盘里的那壶清酒。我不忍心看他太过寂寞，于是便从刀里出来。漂泊大人念我是一抹魂魄，不能触摸到他，便说道「馋的话准你使用我的刀了」——我便喜出望外，急不可耐地用大人那把爱刀开始磨屄。漂泊大人看我一直呻吟却到不了高潮，便伸出手帮我，用刀鞘掰开那两片肉瓣开始肏我，刀鞘上被他接触过的地方还留有余温，我被烫得几乎没几下便到了。结束后，他将刀举到眼前，似笑非笑，抬眼望我，用还带着伤疤痕迹的唇，轻轻吻了我碰过的那处……于是我又可耻地感受到身下那里分泌出了一股一股的爱液。</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-jonin">💅</span><strong>圈圈面具怪人</strong></p><p>前辈是不是被骗了？阿飞实名举报这个漂带他后院里有漂泊卡，侠隐卡，彩面华卡——唔唔唔，不要捂嘴呀——</p><p class="ao3-actions">👍 22　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-puppy">🍆</span><strong>红月大计吧</strong></p><p>哼。不过是一介把自己过去都忘记了的浪人，值得你如此投怀送抱？</p><p class="ao3-actions">👍 11　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">6</span><span class="ao3-rank-avatar ao3-tone-scan">📷</span><span class="ao3-rank-info"><strong>斯坎儿</strong><br /><small>涂着紫色眼影，是阿飞的长期炮友。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">
          <div class="ao3-detail-dialog"><p>我和阿飞最近偶遇的时候不多呢，不过上次约的时候还挺刺激的。我按照他的要求，屄里塞了跳蛋去见他，不过没想到他连房间都没有开，直接把我按在厕所隔间里肏了一顿。阿飞好像很满意我这次来见他之前把屄上的毛都剃光了的样子，刚把我推进厕所，便伸手扯出来那个还在嗡嗡震的小东西，用手指便让我去了一次。阿飞说我和别的卡卡西完全不一样——「别的卡卡西总是端着，而你什么骚话都说得出来」这对我来说，算得上是夸奖吗？（笑）</p></div>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">💯</span><strong>你有看到我老婆吗</strong></p><p>终于舍得露出那颗嘴角的小痣了……不过这套装扮并不是很适合卡卡西。</p><p class="ao3-actions">👍 27　💬 回复　🔗 分享</p></blockquote>
          <blockquote><p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-anbu">💅</span><strong> 圈圈面具怪人</strong></p><p>斯坎儿前辈就是很骚！像那个小暗部，就算被肏晕过去也连喜欢都不好意思说出口。但斯坎儿前辈不一样，真的是什么骚话都说得出来——「阿飞的鸡巴好大」「斯坎儿的小屄要被阿飞操烂了」，实在是听得阿飞都脸红心跳！</p><p class="ao3-actions">👍 18　💬 回复　🔗 分享</p></blockquote>
        </div>
      </details>

      <details class="ao3-rank-item">
        <summary><span class="ao3-rank-number">7</span><span class="ao3-rank-avatar ao3-tone-aka">🥀</span><span class="ao3-rank-info"><strong>晓卡</strong><br /><small>有严重性瘾和心理问题，和木叶的五代目火影不清不楚。</small></span><span class="ao3-rank-arrow">▼</span></summary>
        <div class="ao3-rank-detail">

可是，为什么？我百般困惑不得其解，明明恋慕，卡卡西为何要逃开我？我明明是他的英雄，他的救世主，为何唯独不配拥有他？

也许是我的逼迫超过了他能够容忍的界限，在一个毫无预兆的清晨，他杀掉了团藏，用苦无在护额上划了一道后毅然决然地离开了。在得到消息的第一时间，我推拒掉了所有的会议，文书以及一切工作，我杀了那两个妄想拦住我的丑陋且皱巴巴的老人，把波风水门和奈良鹿久的警告抛在脑后，不顾一切追出了村。

旗木卡卡西逃向月亮。而我能找到他，我总能找到他。他是长在我眼睛上的一副骨肉皮，因此我理所当然将拥有他的全部。

旗木卡卡西不停地叫骂着，这个时候他倒是有点像以前那个自命不凡的天才了。“别碰我”——他如此喊道，而我的回应则是把鼻尖埋进他的阴阜里深深吸了一口气，那处穴口冒着热气，带着一点皂香，和他身上萦绕的紫藤气味。我用舌头肏卡卡西的时候他终于放弃了用那嘶哑的嗓子叫喊，转而开始无声地流眼泪。

他果然发现了，我的心沉下去，我不想听。“玖辛奈就是木叶的人柱力，我猜的对吗？”听到我的这句问话，卡卡西的眼神再一次灰暗下来，于是我让他跪下，屁股撅好。他前面的那个屄还在滴水，但我今天的计划是催熟那个后面的穴。我用他自己流出来的水给他做了润滑，在推进去假几把的时候感受到他内壁的痉挛，它们缠着那根金属棒，像在辨认是什么物什，在发现不是活物后，又失望地夹了两下。

我决定继续用木遁教学。枝条滑进他口腔里，卡卡西的舌头很软，被枝条碰到的时候往后缩了一下，木遁追上去压住他的舌根，他开始有轻微的作呕反应，不过没有表现出太多的推拒。我让木遁纸条缠住他的舌头，轻轻往外拉扯，而我则将还带着皮质手套的手伸进去摩挲他的舌根，让他适应异物触碰喉咙的感觉，直到作呕反射明显减弱。

我的心因为这小小的变化，雀跃不已。

D6

<script>
const rawDiary = document.getElementById("diarySource").value;
const diaryIndex = document.getElementById("diaryIndex");
const diaryPages = document.getElementById("diaryPages");

const weather = [
  { icon: "☁️", text: "阴 / low cloud" },
  { icon: "🌧️", text: "微雨 / light rain" },
  { icon: "🌫️", text: "无风 / still air" },
  { icon: "🌁", text: "湿雾 / damp fog" },
  { icon: "🌤️", text: "薄晴 / pale sun" },
  { icon: "🌙", text: "夜晴 / clear night" },
  { icon: "🌦️", text: "将雨 / before rain" }
];

function escapeHtml(value) {
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function splitDiary(raw) {
  const normalized = raw.replace(/\r\n/g, "\n").trim();
  const matches = Array.from(normalized.matchAll(/^D(\d+)\s*$/gm));
  const intro = matches.length ? normalized.slice(0, matches[0].index).trim() : normalized;
  const introBody = intro.replace(/^\u6211\u7684\u81ea\u767d\s*\n+/, "").trim();
  const entries = [];

  if (introBody) {
    entries.push({ day: "00", label: "CONF", title: "\u6211\u7684\u81ea\u767d", weather: null, text: introBody, outline: false });
  }

  matches.forEach((match, index) => {
    const start = match.index + match[0].length;
    const end = index + 1 < matches.length ? matches[index + 1].index : normalized.length;
    const day = match[1].padStart(2, "0");
    entries.push({
      day,
      label: `D${match[1]}`,
      title: `第 ${match[1]} 天`,
      weather: weather[index] || { icon: "◌", text: "无记录 / blank" },
      text: normalized.slice(start, end).trim(),
      outline: false
    });
  });

  entries.push({
    day: "08",
    label: "便签筏",
    title: "便签筏",
    weather: null,
    text: "",
    outline: false,
    noteRaft: true
  });

  return entries;
}


function noteRaftMarkup() {
  return `<div class="diary-body note-raft-body">
    <div class="note-raft-stage" role="button" tabindex="0" aria-label="便签筏">
      <p class="note-hint">\u70b9\u51fb\u7a7a\u767d\u9875</p>
      <article class="fall-note one">我会一直等你，有关你的一切，我都有无限的耐心。</article>
      <article class="fall-note two">如果见不到你，我就永远无法获得平静。你不来的话，我会一直等下去，但是在等待的过程中，我干涸的心将充满悲伤。<span class="note-scribble"><span></span><span></span><span></span></span></article>
      <article class="fall-note three">从现在起我开始等你，只要生命和爱对你对我还有意义，我就会一直等下去。</article>
    </div>
  </div>`;
}

function paragraphs(entry) {
  const scratchPhrase = "“带土。”卡卡西在叫我的名字，我";
return entry.text
    .split(/\n{2,}/)
    .map((block) => block.trim())
    .filter(Boolean)
    .map((block) => {
      const rendered = escapeHtml(block).replace(/\n/g, "<br>").replace(scratchPhrase, '<span class="diary-scratch">' + scratchPhrase + '</span>');
      return `<p class="${entry.outline ? "outline-line" : ""}">${rendered}</p>`;
    })
    .join("");
}

const entries = splitDiary(rawDiary);
let activeIndex = 0;

diaryIndex.insertAdjacentHTML("beforeend", entries.map((entry, index) => `
  <button class="diary-tab" type="button" data-target="${index}">
    <span class="diary-tab-day">${entry.label}</span>
    <span><strong>${entry.title}</strong>${entry.weather ? `<span class="diary-tab-meta">${entry.weather.icon} ${entry.weather.text}</span>` : ""}</span>
  </button>
`).join(""));

diaryPages.innerHTML = entries.map((entry, index) => `
  <article class="diary-page" data-page="${index}">
    <header class="diary-paper-head">
      <div>
        <h2>${entry.title}</h2>
      </div>
      ${entry.weather ? `<div class="weather-card"><span class="weather-icon">${entry.weather.icon}</span><span>天气</span><strong>${entry.weather.text}</strong></div>` : ""}
    </header>
    ${entry.noteRaft ? noteRaftMarkup() : `<div class="diary-body">${paragraphs(entry)}</div>`}
    ${entry.label === "D7" ? `<div class="tear-effect" aria-hidden="true"><span class="tear-drop"></span><span class="tear-drop second"></span><span class="tear-stain"></span><span class="tear-stain second"></span></div>` : ""}
    <footer class="diary-footer"><span></span><span>${index + 1} / ${entries.length}</span></footer>
  </article>
`).join("");

const tabs = Array.from(document.querySelectorAll(".diary-tab"));
const pages = Array.from(document.querySelectorAll(".diary-page"));
const bodies = Array.from(document.querySelectorAll(".diary-body"));
let tearTimer = 0;
let tearCooldown = 0;

function clearTearTimer() {
  if (tearTimer) {
    clearTimeout(tearTimer);
    tearTimer = 0;
  }
}

function playTear(page) {
  page.classList.remove("tear-running");
  void page.offsetWidth;
  page.classList.add("tear-running");
  tearCooldown = window.setTimeout(() => {
    page.classList.remove("tear-running");
  }, 5300);
}

function maybeStartTearLoop() {
  const entry = entries[activeIndex];
  const page = pages[activeIndex];
  const body = bodies[activeIndex];
  if (!entry || !page || !body || entry.label !== "D7") {
    clearTearTimer();
    return;
  }

  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 4;
  if (!atBottom) {
    clearTearTimer();
    page.classList.remove("tear-running");
    return;
  }

  if (tearTimer || page.classList.contains("tear-running")) return;
  playTear(page);
  tearTimer = window.setTimeout(() => {
    tearTimer = 0;
    maybeStartTearLoop();
  }, 8000);
}


function setupNoteRaft() {
  const stage = document.querySelector(".note-raft-stage");
  if (!stage) return;
  let step = 0;
  const advance = () => {
    step = Math.min(step + 1, 3);
    stage.classList.remove("note-step-1", "note-step-2", "note-step-3");
    stage.classList.add("note-step-" + step);
    const hint = stage.querySelector(".note-hint");
    if (hint) hint.textContent = step < 3 ? "\u518d\u6b21\u70b9\u51fb\u7a7a\u767d\u9875" : "\u4fbf\u7b7e\u5df2\u843d\u5b9a";
  };
  stage.addEventListener("click", advance);
  stage.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      advance();
    }
  });
}

function setEntry(target) {
  activeIndex = Math.max(0, Math.min(target, entries.length - 1));
  clearTearTimer();
  if (tearCooldown) {
    clearTimeout(tearCooldown);
    tearCooldown = 0;
  }
  tabs.forEach((tab, index) => {
    const active = index === activeIndex;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-current", active ? "page" : "false");
  });
  pages.forEach((page, index) => page.classList.toggle("active", index === activeIndex));
  const activeBody = bodies[activeIndex];
  if (activeBody) activeBody.scrollTop = 0;
  maybeStartTearLoop();
}

tabs.forEach((tab) => tab.addEventListener("click", () => setEntry(Number(tab.dataset.target))));
bodies.forEach((body) => body.addEventListener("scroll", maybeStartTearLoop));

setupNoteRaft();
setEntry(0);
</script>

<p><strong>不要给木叶高中的校写情书了，她早就有男朋友了</strong></p>
<p class="ao3-forum-menu">⋮</p>
</div><div class="ao3-participants"><p>💬 共有 22 条回复</p></div><div class="ao3-rank-list"><details class="ao3-rank-item" open="open"><summary>

  <span class="ao3-rank-avatar ao3-tone-aka">🐝</span>
  <span class="ao3-rank-info"><strong>小飞哥</strong><br /><small>楼主</small></span>
  <span class="ao3-rank-arrow">▼</span>
</summary><div class="ao3-rank-detail"><div class="ao3-detail-dialog">
<p>——其实那个男朋友就是我啦。</p>

<p>嗯对啊我就是超绝不经意炫耀哦，就是你们想的那个校花女神，银白色长发，皮肤很白腰很细，平常也一直戴着口罩，很冷漠，完完全全就是高岭之花的旗木案山子。她看起来完全是那种只可远观不可亵玩的女神对吧？这会儿我正抱着她睡觉呢，头发蹭在我下巴上，像小狗一样爱蹭人，痒得很。</p>

<p>&lt;首次发表时间： 2010-10-04&gt;</p>
</div>
<blockquote>
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-puppy">🐱</span><strong>木叶热心小学生</strong> <small>2L</small></p>
<p>什么呀，就算是卡卡西是女孩子，他也才不会对我好呢。那家伙一直都是第一名，所以平常表现得都很臭屁来着，会因为各种各样的事情揍我。<br />
……所以你到底怎么追到她的啊？</p>
</blockquote>
<div class="ao3-detail-dialog">
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">🐝</span><strong>小飞哥</strong> <small>3L</small></p>
<p>我们是青梅竹马，小时候确实是这样啦，那家伙总是揪着我打，我只不过稍微拽了下她长长的头发，那么小一只的案山子就会骑在我身上揍我，我又从来打不过她。</p>

<p>可恶啊，明明我比她要大一岁。</p>

<p>不过，案山子确实很厉害。她成绩特别好，理所当然考上了重点高中，而我不是读书那块料，初中毕业就没再上学了，现在跟着道上的大哥做事。因此，我一开始很害怕她嫌弃我，虽然老往她学校那边跑，但是只敢在木叶高中后面那条小巷子里，案山子还双手叉腰，质问我为什么不去学校门口等她——我当然害怕其他人看到她和那种社会混混来往，说她坏话嘛，竟然还要对我这么凶！</p>

<p>……不过听到我答复的案山子看上去很落寞的样子，看着这样的她，我突然心跳得很快，脑袋里萌生了一个想法，该不会案山子，虽然一直表现得凶巴巴的，其实对我也是有好感的吧？于是这样想着，我便向她告白了。</p>

<p>案山子，我喜欢你！</p>

<p>……和我交往吧！</p>
</div>
<blockquote>
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-scan">😿</span><strong>这一切都是错误的</strong> <small>4L</small></p>
<p>……只要这样，这样那家伙就会接受吗？然后呢？</p>
</blockquote>
<div class="ao3-detail-dialog">
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">🐝</span><strong>小飞哥</strong> <small>5L</small></p>
<p>然后？</p>

<p>喔，当天我就把她带回我那个出租屋了，是的，我们还没成年，不过比起案山子这种什么都不懂的女高中生，我毕竟已经是社会人士了，所以我就和她做了。</p>

<p>我其实还挺感动的，因为我很穷，一直一个人生活，出租屋里也什么都没有、灯光也很暗，乱糟糟的，在她进来之前我特地用新买的清新剂喷了一下，结果搞得整屋都是那种廉价的柑橘味……可是就算是这样，案山子也没有拒绝我，在我面前的案山子和那些木叶高中的人眼里看到的模样完全不一样，她很主动地和我接吻，嘴唇软软的，我把她压到床上的时候也很温顺，银色的头发散在我那个破枕头上，眼睛亮晶晶地看着我。校服裙摆因为她躺下的动作往上滑了一截，露出白生生的大腿根。</p>

<p>我干进去的时候她还穿着校服，衬衫被掀上去露出粉色的双乳，案山子的乳房没有发育的很好，还是小小的一个，但是很挺、很白、乳尖也没有什么色素沉积，还是淡粉色的。案山子当然还是处女啊（虽然看到过道上那些男的是怎么操女人的，但我其实并没有任何经验），她那里很紧，进去的时候疼得掉眼泪，指甲掐进我后背的肉里。其实我也不好受，我一边慢慢地往里顶，一边亲她的眼睛、她的鼻尖、被汗水粘湿的额发。我和她说放松，告诉她说忍一忍马上就好了。“小案，我在这里呢，别怕。”</p>

<p>她嗯嗯地应着，声音闷在我肩窝里，带着哭腔又软又黏，我的心都要化了。</p>

<p>处男第一次也很快，她抽泣的那两下我就被夹射了，不过我很快又硬起来。第一次的时候我们干了三次，到最后面案山子才被我肏开一点，不再一直哼哼唧唧地抱怨疼，自发学会了又媚又骚的叫声，下面也变得又软又湿，吸得我舒服得快晕过去了。</p>
</div>
<blockquote>
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-spirit">💅</span><strong>圈圈面具怪人</strong> <small>6L</small></p>
<p>啊！阿飞给卡卡西开苞的时候也差不太多呢。果然如果是女孩子的话就会温顺一点，我那个时候的卡卡西一开始可是凶得很，我明明已经把他摁在慰灵碑上了，结果却一直在挣扎呢！不过等我射到他屄里第三次的时候，就完完全全软下来了，认命似的闭上眼睛流着眼泪被我干。</p>
</blockquote>
<div class="ao3-detail-dialog">
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">🐝</span><strong>小飞哥</strong> <small>7L</small></p>
<p>楼上这个家伙怎么这么恐怖！我都有戴好套，肯定是不会内射案山子的。</p>

<p>我很珍惜她。但是确实有那种时候啊，因为手头真的有点紧，没有多余的钱去买套了，可恶啊，这种东西真的卖的好贵，一包的价格都快到我一周的饭钱了，所以我只好告诉案山子说最近不做了——但是，别看那位校花总是一副冷着脸、高岭之花的样子，其实她也很喜欢和我做爱哦。</p>

<p>案山子那家伙，我有偷偷跟踪过她，虽然平时在跟人说话都是那种淡淡的、冷冷的调调，跟谁都隔着一层距离，可是面对我真的完全不一样呀，尤其是在床上的时候，她的声音又软又黏，带着鼻音和哭腔，叫起来的时候尾音会往上翘。</p>

<p>所以这样的案山子，会迷恋上被我肏的感觉、变成那种床上和平日里超级反差的女高中生也是理所应当的。但就算这也，我也完全没想到她会主动到自己放学后去便利店买安全套，就那样戴着口罩，还穿着高中生的制服和短裙，偷偷去便利店买那种东西。她皮肤很白，总是因为一点小事就对我急脸，上来要打我，所以我想结账的时候她的耳朵一定都红透了吧，哎呀，小案真的好可爱啊。</p>
</div>
<blockquote>
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-hokage">💌</span><strong>一般路过家庭煮夫</strong> <small>8L</small></p>
<p>……没有的事。那家伙还没成年的时候就开始看亲热天堂了。</p>

<p>完完全全的闷骚大叔啊。</p>
</blockquote>
<div class="ao3-detail-dialog">
<p class="ao3-comment-speaker"><span class="ao3-mini-avatar ao3-tone-aka">🐝</span><strong>小飞哥</strong> <small>9L</small></p>
<p>你这家伙闭嘴！案山子明明就是香香软软的女高中生！</p>

<p>……说真的，我不知道我能给案山子什么。虽然平常和别人吹牛，说自己是黑社会，其实完全没有，我只是一个给黑道做事的混混而已，住在破出租屋里，银行卡里也没什么钱。</p>

<p>而案山子那么漂亮，她还是学校里最优秀的学生。</p>

<p>这样的案山子，经常在学校里被人表白。我其实看到不止一次了，每次看到的时候，我心里都有一些钝痛，我觉得我比不上那些和案山子一样，在学校里读书、有着大好前程的家伙们。每一次在收到告白的时候，案山子口罩下都是一副不耐烦的样子。可是为什么，每一次拒绝的时候，她不说自己有男朋友呢？只要说了这句话之后，应该就没人烦她了吧。</p>

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, "&#39;");

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function renderInlineNotes(text) {
      const pattern = /（(.+?)(?:二字|儿子)?(?:为(红色|蓝色)\+)?(?:加下划线|下划线)，点击后弹出(?:一个)?窗口：([^）]+)）|（(.+?)(?:二字|儿子)?(?:为(红色|蓝色)\+)?(?:加下划线|下划线)，点击后弹窗：([^）]+)）/g;
      let result = "";
      let last = 0;
      let match;
      while ((match = pattern.exec(text))) {
        const target = (match[1] || match[4] || "").trim();
        const color = (match[2] || match[5] || "").trim();
        const note = (match[3] || match[6] || "").trim();
        let segment = text.slice(last, match.index);
        const targetIndex = segment.lastIndexOf(target);
        if (target && targetIndex >= 0) {
          result += escapeHtml(segment.slice(0, targetIndex));
          result += '<button class="inline-note ' + (color === "蓝色" ? "note-blue" : color === "红色" ? "note-red" : "") + '" type="button" data-note="' + escapeAttr(note) + '">' + escapeHtml(target) + '</button>';
          result += escapeHtml(segment.slice(targetIndex + target.length));
        } else {
          result += escapeHtml(segment);
        }
        last = match.index + match[0].length;
      }
      result += escapeHtml(text.slice(last));
      return result;
    }

    function renderParagraph(line) {
      if (line && typeof line === "object" && line.type === "switchReveal") {

      }
      const marker = "（加粗斜体放大中央，点击屏幕后出现）";
      const text = String(line);

        return '<p class="dramatic-line" data-reveal="tap">' + escapeHtml(text.replace(marker, "")) + '</p>';

      const stage = Number(box.dataset.stage || "0");
      if (stage >= 2) return;
      const text = stage === 0 ? box.dataset.first : box.dataset.second;

    function escapeText(value) {
      const span = document.createElement('span');
      span.textContent = value == null ? '' : String(value);
      return span.innerHTML;
    }

    function decodeUtf8Base64(value) {
      const binary = atob(value);
      const bytes = Uint8Array.from(binary, function(char) { return char.charCodeAt(0); });
      if ('TextDecoder' in window) {
        return new TextDecoder().decode(bytes);
      }
      return decodeURIComponent(Array.from(bytes, function(byte) {
        return '%' + byte.toString(16).padStart(2, '0');
      }).join(''));
    }

    function parseRegisteredUsers() {
      const blocks = decodeUtf8Base64(registeredUsersBase64).replace(/\r\n/g, '\n').trim().split(/\n\s*\n+/).filter(Boolean);

        kakashi: blocks.slice(10)
      };
    }

      const titleMatch = titleText.match(/^(\S+)(\s+[\s\S]*)?$/u);
      const role = titleMatch ? titleMatch[1] : titleText;
      const nickname = titleMatch && titleMatch[2] ? titleMatch[2].trimStart() : '';
      return {
        avatar: avatar,
        html: '<span>' + escapeText(role) + '</span>' + (nickname ? ' <span class="user-nickname">' + escapeText(nickname) + '</span>' : '')
      };
    }

    let frameResizeTimer = 0;
    let frameResizeObserver = null;
    let frameMutationObserver = null;
    let activeChapterIndex = -1;

    function stopFrameResizeWatchers() {
      if (frameResizeTimer) {
        clearInterval(frameResizeTimer);
        frameResizeTimer = 0;
      }
      if (frameResizeObserver) {
        frameResizeObserver.disconnect();
        frameResizeObserver = null;
      }
      if (frameMutationObserver) {
        frameMutationObserver.disconnect();
        frameMutationObserver = null;
      }
    }

    function resizeChapterFrame() {
      const doc = chapterFrame.contentDocument;
      if (!doc || !doc.documentElement || !doc.body) return;
      if (activeChapterIndex === 4) {
        doc.documentElement.style.overflowY = 'auto';
        doc.body.style.overflowY = 'auto';
        return;
      }
      doc.documentElement.style.overflowY = 'hidden';
      doc.body.style.overflowY = 'hidden';
      const visibleBlocks = Array.from(doc.body.children).filter(function(el) {
        const style = doc.defaultView.getComputedStyle(el);
        return style.display !== 'none' && style.visibility !== 'hidden' && !['SCRIPT', 'STYLE'].includes(el.tagName);
      });
      const contentBottom = visibleBlocks.reduce(function(bottom, el) {
        const rect = el.getBoundingClientRect();
        const style = doc.defaultView.getComputedStyle(el);
        const marginBottom = Number.parseFloat(style.marginBottom) || 0;
        return Math.max(bottom, rect.bottom + marginBottom);
      }, 0);
      const currentHeight = chapterFrame.getBoundingClientRect().height || 720;
      const maxFrameHeight = activeChapterIndex === 3 || window.matchMedia('(max-width: 720px)').matches ? 12000 : 2600;
      const nextHeight = Math.max(620, Math.min(maxFrameHeight, Math.ceil(contentBottom + 12)));
      if (Math.abs(nextHeight - currentHeight) > 18) {
        chapterFrame.style.height = nextHeight + 'px';
      }
    }

    function watchChapterFrame() {
      stopFrameResizeWatchers();
      resizeChapterFrame();
      const doc = chapterFrame.contentDocument;
      if (!doc || !doc.body) return;
      if (activeChapterIndex === 4) return;
      if ('ResizeObserver' in window) {
        frameResizeObserver = new ResizeObserver(resizeChapterFrame);
        frameResizeObserver.observe(doc.body);
        frameResizeObserver.observe(doc.documentElement);
      }
      frameMutationObserver = new MutationObserver(resizeChapterFrame);
      frameMutationObserver.observe(doc.body, { childList: true, subtree: true, attributes: true });
      frameResizeTimer = setInterval(resizeChapterFrame, 900);
    }

    function openChapter(index) {
      const chapter = chapters[index];
      if (!chapter) return;
      const html = chapterHtml(chapter);
      if (!html) return;
      stopFrameResizeWatchers();
      readerTitle.textContent = chapter.title;
      readerMeta.textContent = chapter.author + ' \u00b7 ' + chapter.date + ' \u00b7 ' + chapter.replies + ' \u56de\u7b54 \u00b7 ' + chapter.views + ' \u70b9\u51fb';
      readerBadge.textContent = chapter.label;
      activeChapterIndex = index;
      readerView.classList.toggle('flat-thread-reader', index === 3 || index === 4);
      chapterFrame.classList.toggle('is-scrollable', index === 4);
      chapterFrame.style.height = index === 4 ? '' : '720px';
      chapterFrame.onload = watchChapterFrame;
      chapterFrame.srcdoc = html;
      homeView.classList.add('hidden');
      readerView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeChapter() {
      stopFrameResizeWatchers();
      chapterFrame.onload = null;
      chapterFrame.removeAttribute('srcdoc');
      activeChapterIndex = -1;
      readerView.classList.remove('flat-thread-reader');
      chapterFrame.classList.remove('is-scrollable');
      chapterFrame.style.height = '720px';
      readerView.classList.remove('active');
      homeView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

        passwordInput.select();
      }
    });

    topicList.addEventListener('click', function(event) {
      const row = event.target.closest('[data-index]');
      if (row) openChapter(Number(row.dataset.index));
    });
    statTriggers.forEach(function(button) {
      button.addEventListener('click', function() {
        openUsers(button.dataset.userGroup);
      });
    });
    usersClose.addEventListener('click', closeUsers);
    usersModal.addEventListener('click', function(event) {
      if (event.target.hasAttribute('data-users-close')) closeUsers();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && usersModal.classList.contains('active')) closeUsers();
    });
    backButton.addEventListener('click', closeChapter);
    window.addEventListener('beforeunload', stopFrameResizeWatchers);

    renderTopics();
  </script>
</body>
</html>
